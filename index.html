<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>How does Flexbox line things up?</h1>
  <p class="step" id="step">Screen 1</p>

  <div class="stage">
    <div class="cards" id="cards">
      <span class="cards-label" id="label">.cards (the container)</span>
      <div class="card"><span class="name">card 1</span><span class="size"></span></div>
      <div class="card"><span class="name">card 2</span><span class="size"></span></div>
      <div class="card"><span class="name">card 3</span><span class="size"></span></div>
    </div>
  </div>

  <p class="caption" id="caption"></p>
  <p class="note" id="note"></p>
  <div class="code" id="code"></div>

  <div class="controls">
    <button id="back">← Back</button>
    <button id="next">Next →</button>
  </div>

  <script src="script.js"></script>
   
</body>
</html>
